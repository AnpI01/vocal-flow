services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vocalflow
      POSTGRES_PASSWORD: vocalflow_dev_password
      POSTGRES_DB: vocalflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocalflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  tts-api:
    build:
      context: ./services/tts-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      API_KEY: dev-api-key-change-me
      MODEL_NAME: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    volumes:
      - ./services/tts-api/temp:/app/temp
      - ./services/tts-api/cache:/app/cache

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Inside the Docker network, containers reach each other by
      # service name, not localhost - "postgres" and "tts-api" here
      # are the service names defined above, resolved via Docker's
      # internal DNS.
      DATABASE_URL: postgresql://vocalflow:vocalflow_dev_password@postgres:5432/vocalflow
      TTS_API_URL: http://tts-api:8000
      TTS_API_KEY: dev-api-key-change-me
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: http://localhost:3000
    volumes:
      # Persist uploaded/generated audio across container rebuilds
      - ./apps/web/public/voice-samples:/app/public/voice-samples
      - ./apps/web/public/generated-audio:/app/public/generated-audio
    depends_on:
      postgres:
        condition: service_healthy
      tts-api:
        condition: service_started

volumes:
  postgres_data:
